openapi: 3.1.0
info:
  title: PlaceMe gd-proto API
  version: 0.1.0
  description: >
    apps/server's REST API. Source of truth for the request/response
    contract between gd-proto and its frontends (placeme-UI canonically;
    apps/web and gd-frontend consume the same routes). Hand-authored
    against the actual route handlers in src/api/routes/ — see
    ACTION_PLAN.md Phase 3 for how this is kept in sync and CONTRIBUTING
    notes below.

    Every mutating/reading route except /health, /ready, and
    /health/agent requires a Supabase-issued bearer token (bearerAuth).
    Every error response, from any route, uses the shared Error schema
    (`{ "error": "<message>" }`) — set once in api/middleware/
    errorHandler.js and reused by every route's explicit early-return
    error responses too.
servers:
  - url: https://gd-proto-1.onrender.com
    description: Production
  - url: http://localhost:3000
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: health
    description: Unauthenticated liveness/readiness/monitoring endpoints.
  - name: me
    description: Identity.
  - name: consent
    description: Recording, checking, and withdrawing pilot consent (guardrail #3).
  - name: account
    description: Self-serve account actions (DPDP right-to-erasure intake).
  - name: topics
    description: Discussion topic generation and submission.
  - name: rooms
    description: Room lifecycle — create, join, match, start, poll, and read.
  - name: feedback
    description: Post-session generated feedback, nested under rooms.
  - name: history
    description: A student's own past sessions.
  - name: mcq
    description: >-
      MCQ practice tests (SPEC-0017). Question text and test templates come
      from the public bundle in the `mcq-bank` storage bucket, not this API.
      Every route 404s while the `mcq` feature flag (feature_flags table,
      migration 0039) is off.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [health]
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /ready:
    get:
      operationId: getReady
      summary: Readiness check (config + DB connectivity)
      tags: [health]
      security: []
      responses:
        "200":
          description: Ready to serve real traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        "503":
          description: Not ready — missing config or DB unreachable.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, reason, missingEnvVars]
                    properties:
                      status: { type: string, enum: [not_ready] }
                      reason: { type: string, enum: [missing_config] }
                      missingEnvVars: { type: array, items: { type: string } }
                  - type: object
                    required: [status, reason]
                    properties:
                      status: { type: string, enum: [not_ready] }
                      reason: { type: string, enum: [db_unreachable] }

  /health/agent:
    get:
      operationId: getAgentHealth
      summary: Transcription/feedback dispatch health (internal monitoring)
      tags: [health]
      security:
        - healthToken: []
      responses:
        "200":
          description: >-
            Current in-process dispatch counters, plus (SPEC-0016) process,
            sweeper and evaluation-runner liveness, Gemini quota buckets, DB
            latency and per-route request counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user's id
      tags: [me]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId: { type: string, format: uuid }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consent/status:
    get:
      operationId: getConsentStatus
      summary: This user's current consent version and mic-enable eligibility
      tags: [consent]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consent:
    post:
      operationId: grantConsent
      summary: Record this user's consent grant for the current version
      tags: [consent]
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [consentVersion, grantedAt]
                properties:
                  consentVersion: { type: integer }
                  grantedAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consent/withdraw:
    post:
      operationId: withdrawConsent
      summary: Withdraw this user's consent (gates future mic-enablement; the consent record itself is kept, never deleted)
      tags: [consent]
      responses:
        "200":
          description: >
            OK. Returned whether or not there was anything left to revoke --
            an already-withdrawn consent is not an error (SPEC-0012 AC3).
          content:
            application/json:
              schema:
                type: object
                required: [canEnableMic]
                properties:
                  canEnableMic: { type: boolean, enum: [false] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consent/age-attestation:
    post:
      operationId: attestAdult
      summary: >
        Record a separate minimal adult (18+) confirmation for this user
        (SCRUM-24 follow-up). Not versioned like consent, and not folded
        into POST /api/consent -- age doesn't change with a
        disclosure-copy bump. Idempotent: a second call reports the
        original attestation timestamp rather than an error, and never a
        date of birth or identity document is collected for this control.
      tags: [consent]
      responses:
        "201":
          description: Attestation recorded (or already recorded, unchanged).
          content:
            application/json:
              schema:
                type: object
                required: [ageAttested, ageAttestedAt]
                properties:
                  ageAttested: { type: boolean, enum: [true] }
                  ageAttestedAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/account/deletion-request:
    post:
      operationId: requestAccountDeletion
      summary: >
        Submit a self-serve account-deletion request. Intake only -- a
        founder still executes the deletion via the existing manual process
        (docs/engineering/ACCOUNT_DELETION.md); this does not itself delete
        any data.
      tags: [account]
      responses:
        "201":
          description: >
            Request recorded (or the caller's existing pending request,
            unchanged, if one was already pending -- SPEC-0012 AC4).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/topics/custom:
    post:
      operationId: submitCustomTopic
      summary: Submit a user-authored custom topic
      tags: [topics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "Max length enforced server-side (domain/topicText.js)." }
                category: { type: string }
                difficulty: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/topics/generate:
    post:
      operationId: generateTopic
      summary: Request an AI-generated discussion topic
      tags: [topics]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string }
                difficulty: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: Upstream (Gemini) generation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms:
    post:
      operationId: createRoom
      summary: Create a new code-joinable room
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topicId, durationSeconds]
              properties:
                topicId: { type: string, format: uuid }
                durationSeconds: { type: integer }
                maxParticipants: { type: integer }
                visibility: { $ref: "#/components/schemas/Visibility" }
                level: { $ref: "#/components/schemas/Level" }
                sessionType:
                  type: string
                  enum: [gd]
                  default: gd
                  description: "Only session types with a working module can be created; jam and interview return 400 until theirs ship. Responses use SessionType, which lists every stored type."
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSummary" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Caller already holds a seat in another active room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveSeatConflictError" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/rooms/open:
    get:
      operationId: listOpenRooms
      summary: Browse rooms open to join right now (waiting + public + not full)
      tags: [rooms]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: "#/components/schemas/OpenRoom" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/rooms/mine/active:
    get:
      operationId: getActiveRoom
      summary: This user's currently active (waiting/live) room, if any
      tags: [rooms]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [id, code, status]
                        properties:
                          id: { type: string, format: uuid }
                          code: { type: string }
                          status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/rooms/join:
    post:
      operationId: joinRoomByCode
      summary: Join an existing room by its short code
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Joined (or already seated)
          content:
            application/json:
              schema:
                type: object
                required: [id, code, status]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Room already ended/live, full, or (SCRUM-26) the caller already
            holds a seat in a different active room — a rejoin of a room
            the caller is already seated in is never rejected this way.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ActiveSeatConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/rooms/{id}/seat:
    delete:
      operationId: leaveWaitingSeat
      summary: >-
        Give up a seat in a room that hasn't started yet (SCRUM-26). If the
        caller is the room's creator, the room is cancelled outright and
        every other seated participant's seat is freed. Does not interact
        with POST /api/rooms/{id}/leave (SCRUM-21, live-only, unchanged).
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Seat freed, or room cancelled if the caller was its creator.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Room is not in waiting status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/match:
    post:
      operationId: requestMatch
      summary: Request random matchmaking; may queue or return an immediately-formed room
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                durationSeconds: { type: integer }
      responses:
        "200":
          description: >-
            Still queued, waiting for enough participants. Also returned when
            the caller would have completed a group but topic generation
            failed: the caller is queued and nobody leaves the queue
            (SPEC-0016); polling again retries.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [queued] }
        "201":
          description: Matched — a new room was formed.
          content:
            application/json:
              schema:
                type: object
                required: [id, code, status, topicId, members]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
                  topicId: { type: string, format: uuid }
                  members:
                    type: array
                    items: { type: string, format: uuid }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Caller already holds a seat in another active room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveSeatConflictError" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: >-
            A group was claimed but the room could not be created or seated
            (`code: match_failed`). Every other matched member was put back in
            the queue; the caller should request a match again (SPEC-0016).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: leaveMatchQueue
      summary: Leave the random-match queue (idempotent)
      tags: [rooms]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [left] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/rooms/{id}/start:
    post:
      operationId: startRoom
      summary: Start a waiting room (creator only), transitioning it to live
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [id, status, endsAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
                  endsAt: { type: integer, description: "Epoch ms." }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the room's creator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Already ended, the pilot concurrency cap is hit, the room lost
            a concurrent start race (SCRUM-26, code room_already_live), or
            it's below the minimum participant count (SCRUM-26, code
            room_not_ready).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/RoomNotReadyError"

  /api/rooms/{id}/leave:
    post:
      operationId: leaveRoom
      summary: >-
        Leave a still-live room early. Does not end the room for other
        participants; durably claims feedback generation for just the caller,
        scored from the transcript captured through a bounded flush cutoff.
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: An existing idempotent evaluation job was returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyLeaveEvaluationResponse" }
        "202":
          description: A durable evaluation job was claimed and accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyLeaveEvaluationResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room is not live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Evaluation is disabled (`evaluation_disabled`), or it is
            temporarily unavailable (`evaluation_claim_failed`): the durable
            job claim failed, or this server instance is shutting down and no
            longer accepts new evaluation work (SPEC-0016). Retrying shortly
            reaches the next instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/{id}/leave/evaluation:
    get:
      operationId: getEarlyLeaveEvaluation
      summary: Read the caller's durable early-leave evaluation state.
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Current state, or null if no early-leave job exists.
          content:
            application/json:
              schema:
                type: object
                required: [evaluation]
                properties:
                  evaluation:
                    anyOf:
                      - $ref: "#/components/schemas/EarlyLeaveEvaluation"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/{id}/status:
    get:
      operationId: getRoomStatus
      summary: Poll a room's lifecycle status, topic, and timing
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/rooms/{id}/token:
    post:
      operationId: getRoomToken
      summary: Mint a LiveKit join token for this room's audio (requires current consent)
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, url, identity, roomName]
                properties:
                  token: { type: string }
                  url: { type: [string, "null"], format: uri }
                  identity: { type: string, format: uuid }
                  roomName: { type: string, format: uuid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Consent not current, or not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Room has already ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/{id}/participants:
    get:
      operationId: getRoomParticipants
      summary: List seated participants and their talk-time share
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [participants]
                properties:
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/RoomParticipant" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/{id}/transcript:
    get:
      operationId: getRoomTranscript
      summary: The full attributed transcript recorded so far for this room
      tags: [rooms]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/TranscriptLine" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a participant of this room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms/{id}/feedback/mine:
    get:
      operationId: getMyFeedback
      summary: This user's own generated feedback for a room, if ready yet
      tags: [feedback]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: >
            OK. `{ "feedback": null }` while generation is still in flight —
            not an error state, callers should poll.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/rooms/{id}/feedback/mine/rating:
    patch:
      operationId: rateFeedback
      summary: Thumbs up/down (with optional reason) this user's own feedback
      tags: [feedback]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rating, ratingReason]
                properties:
                  rating: { type: boolean }
                  ratingReason: { type: [string, "null"] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No feedback exists yet to rate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/history/mine:
    get:
      operationId: getMyHistory
      summary: This user's past sessions, most recent first
      tags: [history]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/HistorySession" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mcq/tests/{testId}/attempts:
    post:
      operationId: startMcqAttempt
      summary: Start an attempt at a test, or resume the caller's open one
      description: >-
        Draws the questions (unseen in the caller's last 10 attempts first)
        and sets a server-owned deadline. A student has at most one open
        attempt: if one exists, for any test, it is returned instead, so
        compare `testId` with the requested one.
      tags: [mcq]
      parameters:
        - name: testId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The new or already-open attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McqAttemptStart" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: No question bank has been published yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/mcq/attempts/{id}/checkpoint:
    put:
      operationId: checkpointMcqAttempt
      summary: Save in-progress answers (batched, not per answer)
      description: >-
        Send only when something changed (about every 60s, and on tab hide).
        A checkpoint with a `seq` no higher than the stored one returns
        `stale` and changes nothing. After the deadline plus 5s, or once
        submitted, it returns `closed`: show the results.
      tags: [mcq]
      parameters:
        - $ref: "#/components/parameters/McqAttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, answers]
              properties:
                seq: { type: integer, minimum: 1, maximum: 2147483647 }
                answers: { $ref: "#/components/schemas/McqAnswers" }
      responses:
        "200":
          description: Checkpoint outcome.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, stale, closed] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/mcq/attempts/{id}/submit:
    post:
      operationId: submitMcqAttempt
      summary: Submit an attempt and get the score, answer keys and explanations
      description: >-
        Safe to repeat: a second submit returns the stored result. Omit
        `answers` to score the last checkpoint. Answers sent after the
        deadline plus 5s are ignored and the last checkpoint is scored.
      tags: [mcq]
      parameters:
        - $ref: "#/components/parameters/McqAttemptId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { $ref: "#/components/schemas/McqAnswers" }
      responses:
        "200":
          description: The scored attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McqSubmitResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: "Supabase Auth access token, as `Authorization: Bearer <token>`."
    healthToken:
      type: apiKey
      in: header
      name: x-health-token
      description: >
        HEALTH_CHECK_TOKEN shared secret. Required in production
        (server refuses to start without one configured); optional in
        other environments.

  parameters:
    McqAttemptId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoomId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    McqAnswer:
      type: object
      additionalProperties: false
      properties:
        c:
          type: [integer, "null"]
          minimum: 0
          maximum: 3
          description: Chosen option index, null when unanswered.
        t: { type: number, minimum: 0, description: "Time spent on the question, ms (clamped server-side to 3 h)." }
        r: { type: boolean, description: "Marked for review." }
    McqAnswers:
      type: object
      description: Keyed by question id (uuid). At most 200 entries; ids outside the attempt are dropped.
      maxProperties: 200
      additionalProperties: { $ref: "#/components/schemas/McqAnswer" }
    McqAttemptStart:
      type: object
      required: [attemptId, testId, questionIds, bankVersion, startedAt, endAt, now, answers, checkpointSeq]
      properties:
        attemptId: { type: string, format: uuid }
        testId: { type: string, format: uuid }
        questionIds:
          type: array
          description: In display order. Render them from the bundle for `bankVersion`.
          items: { type: string, format: uuid }
        bankVersion: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        now: { type: string, format: date-time, description: "Server clock, to correct the client timer." }
        answers: { $ref: "#/components/schemas/McqAnswers" }
        checkpointSeq: { type: integer, minimum: 0, description: "Send checkpoints with a higher seq." }
    McqSectionScore:
      type: object
      required: [correct, total]
      properties:
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    McqSubmitResult:
      type: object
      required: [attemptId, score, sectionScores, submitReason, submittedAt, keys]
      properties:
        attemptId: { type: string, format: uuid }
        score: { type: integer, minimum: 0, description: "Number of correct answers." }
        sectionScores:
          type: object
          additionalProperties: { $ref: "#/components/schemas/McqSectionScore" }
        submitReason: { type: string, enum: [student, expired] }
        submittedAt: { type: string, format: date-time }
        keys:
          type: array
          description: One per question, in the attempt's order.
          items:
            type: object
            required: [questionId, correctIndex, explanation]
            properties:
              questionId: { type: string, format: uuid }
              correctIndex: { type: integer, minimum: 0, maximum: 3 }
              explanation: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    EarlyLeaveEvaluationResponse:
      type: object
      required: [evaluation]
      properties:
        evaluation:
          $ref: "#/components/schemas/EarlyLeaveEvaluation"

    EarlyLeaveEvaluation:
      type: object
      required: [jobId, status, finality, accepted, disposition, terminal]
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        finality:
          type: string
          enum: [pending, flushed, timed_out_partial]
        accepted: { type: boolean }
        terminal:
          type: boolean
          description: True when the job cannot transition again and polling must stop.
        disposition:
          type: string
          enum: [accepted, already_accepted]

    Visibility:
      type: string
      enum: [public, private]

    Level:
      type: string
      enum: [beginner, intermediate, advanced]

    # W1-1 (SCRUM-88): which kind of session a room is (every value 0033's
    # CHECK allows). Create accepts only gd for now (see POST /api/rooms);
    # matched rooms are always gd. See migration 0033_rooms_session_type.sql.
    SessionType:
      type: string
      enum: [gd, jam, interview]
      default: gd

    RoomLifecycleStatus:
      type: string
      enum: [waiting, live, ended]

    # SCRUM-26 (SPEC-0014): set when a waiting room is cancelled instead of
    # ending normally -- its creator gave up their seat (cancelled_by_creator)
    # or it sat abandoned past the sweep's timeout (cancelled_expired).
    # Omitted (not present) for a room that actually ran. See migration
    # 0027_rooms_end_reason.sql.
    RoomEndReason:
      type: string
      enum: [cancelled_by_creator, cancelled_expired]

    # SCRUM-26 (SPEC-0014): the caller already holds a seat in a different
    # waiting/live room. Returned by POST /api/rooms, /api/rooms/join, and
    # /api/rooms/match.
    ActiveSeatConflictError:
      type: object
      required: [error, code, activeRoom]
      properties:
        error: { type: string }
        code: { type: string, enum: [active_seat_conflict] }
        activeRoom:
          type: object
          required: [id, code, status]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            status: { $ref: "#/components/schemas/RoomLifecycleStatus" }

    # SCRUM-26 (SPEC-0014): the room is below the minimum participant count
    # required to start. Returned by POST /api/rooms/{id}/start.
    RoomNotReadyError:
      type: object
      required: [error, code, participantCount, minParticipants]
      properties:
        error: { type: string }
        code: { type: string, enum: [room_not_ready] }
        participantCount: { type: integer }
        minParticipants: { type: integer }

    ConsentStatus:
      type: object
      required: [currentVersion, canEnableMic, ageAttested]
      properties:
        currentVersion: { type: integer }
        canEnableMic: { type: boolean }
        ageAttested:
          type: boolean
          description: >
            Whether this user has recorded the separate minimal adult (18+)
            confirmation (SCRUM-24 follow-up). Independent of canEnableMic --
            audio-sharing consent alone is not adult-eligibility evidence.

    DeletionRequest:
      type: object
      required: [requestedAt]
      properties:
        requestedAt: { type: string, format: date-time }

    Topic:
      type: object
      required: [id, text, source, created_at]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        category: { type: [string, "null"] }
        difficulty: { type: [string, "null"] }
        source: { type: string, enum: [custom, llm] }
        created_at: { type: string, format: date-time }

    RoomSummary:
      type: object
      required: [id, code, status, topicId, durationSeconds, maxParticipants, visibility, level, sessionType]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        topicId: { type: string, format: uuid }
        durationSeconds: { type: integer }
        maxParticipants: { type: integer }
        visibility: { $ref: "#/components/schemas/Visibility" }
        level: { $ref: "#/components/schemas/Level" }
        sessionType: { $ref: "#/components/schemas/SessionType" }

    OpenRoom:
      type: object
      required:
        [id, code, topicText, durationSeconds, maxParticipants, participantCount, hostDisplayName, createdAt, sessionType]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        topicText: { type: [string, "null"] }
        durationSeconds: { type: integer }
        maxParticipants: { type: integer }
        participantCount: { type: integer }
        hostDisplayName: { type: string }
        createdAt: { type: string, format: date-time }
        sessionType: { $ref: "#/components/schemas/SessionType" }

    RoomStatus:
      type: object
      required: [id, status, code, topicText, durationSeconds, isCreator, sessionType]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        code: { type: string }
        topicText: { type: [string, "null"] }
        durationSeconds: { type: integer }
        isCreator: { type: boolean }
        sessionType: { $ref: "#/components/schemas/SessionType" }
        endsAt: { type: integer, description: "Epoch ms. Present once the room has started." }
        endReason: { $ref: "#/components/schemas/RoomEndReason" }

    RoomParticipant:
      type: object
      required: [userId, displayName, talkShare]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        talkShare: { type: number, description: "0-1 share of this room's total attributed speaking time." }

    TranscriptLine:
      type: object
      required: [userId, displayName, text, startedAtMs]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        text: { type: string }
        startedAtMs: { type: integer }

    FeedbackDimension:
      type: object
      required: [label, score, note]
      properties:
        label: { type: string }
        score: { type: number }
        note: { type: string }

    FeedbackResult:
      description: >
        `{ "feedback": null }` before generation finishes; the full object
        once it has. `score` can still be null on a pre-migration row or
        the transcription-failed stub — never render that as a real 0
        (SPEC-0006, BE-6/BE-7).
      oneOf:
        - type: object
          required: [feedback]
          properties:
            feedback: { type: "null" }
        - type: object
          required: [feedback, score, dimensions, strengths, improvements]
          properties:
            feedback: { type: string }
            score: { type: [number, "null"] }
            dimensions:
              type: array
              items: { $ref: "#/components/schemas/FeedbackDimension" }
            strengths: { type: array, items: { type: string } }
            improvements: { type: array, items: { type: string } }
            rating: { type: boolean, description: "Present only once the caller has rated their feedback." }
            ratingReason: { type: [string, "null"] }

    HistorySession:
      type: object
      required:
        [id, code, status, durationSeconds, topicText, startedAt, endedAt, feedback, score, dimensions, strengths, improvements, talkShare]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: "#/components/schemas/RoomLifecycleStatus" }
        durationSeconds: { type: integer }
        topicText: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        feedback: { type: [string, "null"] }
        score: { type: [number, "null"] }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/FeedbackDimension" }
        strengths: { type: array, items: { type: string } }
        improvements: { type: array, items: { type: string } }
        talkShare: { type: [number, "null"] }

    AgentStatus:
      type: object
      required:
        [activeRooms, dispatchSuccesses, dispatchFailures, lastFailure, lastSuccess, healthy, feedbackSuccesses, feedbackFailures, lastFeedbackFailure, lastFeedbackSuccess, feedbackHealthy]
      properties:
        activeRooms: { type: integer }
        dispatchSuccesses: { type: integer }
        dispatchFailures: { type: integer }
        lastFailure:
          oneOf:
            - type: "null"
            - type: object
              required: [roomId, message, at]
              properties:
                roomId: { type: string, format: uuid }
                message: { type: string }
                at: { type: string, format: date-time }
        lastSuccess:
          oneOf:
            - type: "null"
            - type: object
              required: [roomId, at]
              properties:
                roomId: { type: string, format: uuid }
                at: { type: string, format: date-time }
        healthy: { type: boolean }
        feedbackSuccesses: { type: integer }
        feedbackFailures: { type: integer }
        lastFeedbackFailure:
          oneOf:
            - type: "null"
            - type: object
              required: [roomId, message, at]
              properties:
                roomId: { type: string, format: uuid }
                message: { type: string }
                at: { type: string, format: date-time }
        lastFeedbackSuccess:
          oneOf:
            - type: "null"
            - type: object
              required: [roomId, at]
              properties:
                roomId: { type: string, format: uuid }
                at: { type: string, format: date-time }
        feedbackHealthy: { type: boolean }
        # SPEC-0016 R14 (PR 12): operational sections. In-process state only;
        # no secrets (pool keys by label, buckets by project label + model).
        process:
          type: object
          properties:
            workerId: { type: string, description: "Owner of this process's evaluation runs" }
            uptimeSec: { type: integer }
            commit: { type: [string, "null"], description: RENDER_GIT_COMMIT when set }
        sweeper:
          type: [object, "null"]
          properties:
            lastTickStartedAt: { type: [string, "null"], format: date-time }
            lastTickFinishedAt: { type: [string, "null"], format: date-time }
            lastTickDurationMs: { type: [integer, "null"] }
            lastError: { type: [string, "null"], description: Error name only }
        evaluationRunner:
          type: [object, "null"]
          description: Null when no runner runs in this process.
          properties:
            state: { type: string, enum: [idle, running, draining, stopped] }
            activeRuns:
              type: array
              items:
                type: object
                properties:
                  runId: { type: string, format: uuid }
                  startedAt: { type: string, format: date-time }
                  ageSec: { type: integer }
            lastTickAt: { type: [string, "null"], format: date-time }
            lastTickDurationMs: { type: [integer, "null"] }
            lastClaimAt: { type: [string, "null"], format: date-time }
            lastCompletedAt: { type: [string, "null"], format: date-time }
            lastFailureCategory: { type: [string, "null"] }
            oldestDueAgeSec: { type: [integer, "null"] }
            reapedLastPass: { type: [integer, "null"] }
        gemini:
          type: object
          properties:
            buckets:
              type: array
              items:
                type: object
                properties:
                  project: { type: string }
                  model: { type: string }
                  state: { type: string, enum: [available, cooling, exhausted] }
                  until: { type: [string, "null"], format: date-time }
                  inFlight: { type: integer }
                  dailyRequests: { type: integer }
                  lastHourByClass:
                    type: object
                    additionalProperties: { type: integer }
            poolKeys:
              type: array
              items:
                type: object
                properties:
                  keyId: { type: string }
                  healthy: { type: boolean }
                  inFlight: { type: integer }
                  cooldownUntil: { type: [string, "null"], format: date-time }
        db:
          type: object
          description: Rolling window of the last 200 Supabase calls.
          properties:
            p50Ms: { type: [integer, "null"] }
            p95Ms: { type: [integer, "null"] }
            timeoutsLastHour: { type: integer }
        requests:
          type: object
          description: Requests served per route pattern since boot.
          additionalProperties: { type: integer }
