name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run build

  # Phase 3 (ACTION_PLAN.md, cross-repo contract): openapi/gd-proto.openapi.yaml
  # is a vendored copy of gd-proto's docs/api/openapi.yaml (see
  # scripts/sync-contract.mjs and openapi/GD_PROTO_REF for how/when it's
  # synced), and src/lib/api-types.generated.ts is generated from it. This
  # job fails the build if that generated file is stale relative to the
  # vendored spec -- e.g. someone hand-edited it, or updated the vendored
  # spec without regenerating. It does NOT check whether the vendored spec
  # itself is still current against gd-proto's real HEAD -- that would need
  # a cross-repo credential this repo's CI doesn't have (gd-proto is
  # private); bumping openapi/GD_PROTO_REF via `npm run sync-contract` is a
  # manual, reviewable step for now.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run check:contract-drift

  # W1-7: every PR's Vercel preview must talk to staging, never production.
  # Vercel builds the preview itself (Git integration) from the project's
  # "Preview" env vars; this job pulls exactly those vars for this PR's
  # branch, plus the Production ones to compare against, and fails if any
  # preview value is a production URL or key, or if the three vars the app
  # needs are missing. scripts/check-env.js is vendored from gd-proto.
  #
  # Needs the VERCEL_TOKEN secret and the VERCEL_ORG_ID / VERCEL_PROJECT_ID
  # variables (gd-proto/docs/runbooks/staging-environment.md). Until they
  # exist, or on a fork PR (which gets no secrets), the Vercel step warns
  # and skips instead of failing. The pulled files never leave the runner
  # and are deleted at the end. Keep the VITE_* vars non-"Sensitive" in
  # Vercel: they ship to the browser anyway, and Sensitive values pull as
  # empty strings, which --require reports as missing.
  preview-env:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: node --test scripts/check-env.test.js
      - name: No production values in the checked-in staging template
        run: node scripts/check-env.js --staging .env.staging.example
      - name: No production values in this PR's Vercel preview env
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID aren't set, so this PR's preview env was NOT checked for production values. See gd-proto/docs/runbooks/staging-environment.md."
            exit 0
          fi
          trap 'rm -f .env.check.preview .env.check.production' EXIT
          npx --yes vercel@60 env pull .env.check.preview --environment=preview --git-branch="$GITHUB_HEAD_REF" --yes --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@60 env pull .env.check.production --environment=production --yes --token="$VERCEL_TOKEN" > /dev/null
          node scripts/check-env.js \
            --staging .env.check.preview \
            --prod .env.check.production \
            --require VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_API_URL
